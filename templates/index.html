<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Project Checker</title>
    <style>
        /* Apple Style Font & Animated Background */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Premium Glassmorphism Container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .glass-panel:hover {
            transform: translateY(-5px);
        }

        h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        /* Apple Style Input Box */
        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            color: #333;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* 3D Pop-up Button */
        .search-btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.4);
            transition: all 0.2s ease;
        }

        .search-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(118, 75, 162, 0.6);
        }

        .search-btn:active {
            transform: scale(0.95);
        }

        /* Result Popup Animation */
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 15px;
            font-weight: 500;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            display: none;
        }

        .result-box.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        .taken { background: rgba(255, 75, 75, 0.2); border: 1px solid rgba(255, 75, 75, 0.5); color: #d32f2f; }
        .available { background: rgba(76, 175, 80, 0.2); border: 1px solid rgba(76, 175, 80, 0.5); color: #2e7d32; }
        
        /* Loading Spinner */
        .loader {
            display: none;
            margin: 20px auto;
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid #764ba2;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h2>Project Title Checker</h2>
        
        <div class="input-group">
            <input type="text" id="titleInput" placeholder="Enter your project title here..." autocomplete="off">
        </div>

        <button class="search-btn" onclick="checkTitle()">Check Availability</button>
        
        <div class="loader" id="loader"></div>
        <div class="result-box" id="resultBox"></div>
    </div>

    <script>
        async function checkTitle() {
            const title = document.getElementById('titleInput').value;
            const resultBox = document.getElementById('resultBox');
            const loader = document.getElementById('loader');
            const btn = document.querySelector('.search-btn');

            if (!title) {
                alert("Please enter a title first!");
                return;
            }

            // Reset UI
            resultBox.className = 'result-box';
            resultBox.innerHTML = '';
            btn.style.display = 'none';
            loader.style.display = 'block';

            try {
                // Call Python Backend
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title })
                });
                
                const data = await response.json();
                
                // Show Result with smooth animation
                loader.style.display = 'none';
                btn.style.display = 'block';
                
                resultBox.innerHTML = data.message;
                resultBox.classList.add('show', data.status);
                
            } catch (error) {
                loader.style.display = 'none';
                btn.style.display = 'block';
                resultBox.innerHTML = "⚠️ Error connecting to server.";
                resultBox.classList.add('show', 'taken');
            }
        }
    </script>
</body>
</html>
